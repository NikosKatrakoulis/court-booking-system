spring.application.name=court-booking-system
spring.datasource.url=${DB_URL:jdbc:postgresql://locahost:5436/courtbooking}
spring.datasource.username=${DB_USERNAME:courtuser}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
admin.seed.email=${ADMIN_EMAIL}
admin.seed.password=${ADMIN_PASSWORD}
spring.application.name=court-booking-system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/courtbooking}
spring.datasource.username=${DB_USERNAME:courtuser}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
admin.seed.email=${ADMIN_EMAIL}
admin.seed.password=${ADMIN_PASSWORD}

# Slot generation (not secrets, safe defaults)
slots.opening-time=${SLOTS_OPENING_TIME:09:00}
slots.closing-time=${SLOTS_CLOSING_TIME:23:00}
slots.horizon-days=${SLOTS_HORIZON_DAYS:14}
slots.generation-cron=${SLOTS_GENERATION_CRON:0 0 1 * * *}

# Waitlist
waitlist.offer-minutes=${WAITLIST_OFFER_MINUTES:30}
waitlist.expiry-check-cron=${WAITLIST_EXPIRY_CRON:0 * * * * *}

# Idempotency
idempotency.retention-hours=${IDEMPOTENCY_RETENTION_HOURS:24}
idempotency.cleanup-cron=${IDEMPOTENCY_CLEANUP_CRON:0 30 * * * *}
